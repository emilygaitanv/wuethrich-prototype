<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<title>Umbau Amthaus, Aarberg — Wüthrich Architekten AG</title>
<meta name="description" content="Umbau Amthaus Aarberg — öffentliches Gebäude, Massivbau, 7'200 m³. Projekt von Wüthrich Architekten AG im Berner Seeland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FCFAF7; }
  body { font-family: Manrope, system-ui, sans-serif; color: #2E2E2E; -webkit-font-smoothing: antialiased; text-wrap: pretty; }
  a { color: #2E2E2E; text-decoration: none; }
  a:hover { color: #6B6B6B; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .wa-scroll::-webkit-scrollbar { height: 0; width: 0; }
  .wa-scroll { scrollbar-width: none; }
</style>
</helmet>

<div style="position:relative;min-height:100vh;background:#FCFAF7;overflow-x:hidden">



  <main style="padding:132px 0 0">

    <article style="{{ layoutStyle }}">

      <div style="padding:20px 0 0 40px;display:flex;flex-direction:column;gap:44px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <span style="font:500 11px/1 Manrope,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#9A9A9A">{{ kicker }}</span>
          <h1 style="margin:0;font:300 clamp(32px,3.1vw,50px)/1.06 Manrope,sans-serif;letter-spacing:-.01em;color:#2E2E2E;max-width:18ch">{{ title }}</h1>
          <span style="font:500 13px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B">{{ ortLabel }}</span>
        </div>

        <dl style="margin:0;display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(0,0,0,.10);max-width:420px">
          <sc-for list="{{ meta }}" as="m" hint-placeholder-count="5">
            <div style="display:grid;grid-template-columns:120px 1fr;gap:20px;padding:15px 0;border-bottom:1px solid rgba(0,0,0,.10)">
              <dt style="margin:0;font:500 11px/1.4 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A">{{ m.label }}</dt>
              <dd style="margin:0;font:400 15px/1.4 Manrope,sans-serif;color:#2E2E2E">{{ m.value }}</dd>
            </div>
          </sc-for>
        </dl>

        <p style="margin:0;max-width:46ch;font:400 17px/1.65 Manrope,sans-serif;color:#4A4A4A">{{ description }}</p>

        <div style="display:flex;flex-direction:column;gap:14px">
          <span style="font:500 11px/1 Manrope,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#9A9A9A">Teilen</span>
          <div style="display:flex;gap:10px">
            <a href="#" aria-label="Per E-Mail teilen" style="display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,0,0,.10);border-radius:50%;font:500 10px/1 Manrope,sans-serif;letter-spacing:.06em;color:#6B6B6B" style-hover="border-color:rgba(0,0,0,.35);color:#2E2E2E">@</a>
            <a href="#" aria-label="Auf Facebook teilen" style="display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,0,0,.10);border-radius:50%;font:500 10px/1 Manrope,sans-serif;letter-spacing:.06em;color:#6B6B6B" style-hover="border-color:rgba(0,0,0,.35);color:#2E2E2E">FB</a>
            <a href="#" aria-label="Auf LinkedIn teilen" style="display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,0,0,.10);border-radius:50%;font:500 10px/1 Manrope,sans-serif;letter-spacing:.06em;color:#6B6B6B" style-hover="border-color:rgba(0,0,0,.35);color:#2E2E2E">LI</a>
          </div>
        </div>
      </div>

      <section aria-label="Projektgalerie" style="min-width:0;display:flex;flex-direction:column;gap:18px">
        <div style="position:relative;width:100%">
          <figure style="{{ figStyle }}">
            <img src="{{ currentShot }}" alt="{{ currentAlt }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;background:#F4F0E9" />
          </figure>
          <button onClick="{{ galPrev }}" aria-label="Vorheriges Bild" style="{{ arrowPrevStyle }}">←</button>
          <button onClick="{{ galNext }}" aria-label="Nächstes Bild" style="{{ arrowNextStyle }}">→</button>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 40px 0 0">
          <span style="font:400 12px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9A9A9A">{{ shotCaption }}</span>
          <span style="font:500 12px/1 Manrope,sans-serif;letter-spacing:.16em;color:#6B6B6B">{{ shotCounter }}</span>
        </div>
      </section>

    </article>

    <section aria-label="Weitere Projekte" style="margin-top:clamp(80px,9vw,150px);border-top:1px solid rgba(0,0,0,.10);padding:44px 0 110px;overflow:hidden">
      <div style="max-width:1600px;margin:0 auto;padding:0 40px 30px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font:500 11px/1 Manrope,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#9A9A9A">Weiter im Portfolio</span>
          <span style="font:300 clamp(24px,2.4vw,34px)/1.1 Manrope,sans-serif;color:#2E2E2E">{{ nextTitle }}</span>
        </div>
        <div style="display:flex;align-items:center;gap:22px">
          <span style="font:500 12px/1 Manrope,sans-serif;letter-spacing:.16em;color:#6B6B6B">{{ navCounter }}</span>
          <div style="display:flex;gap:8px">
            <button onClick="{{ navPrev }}" aria-label="Vorheriges Projekt" style="width:42px;height:42px;display:grid;place-items:center;background:none;border:1px solid rgba(0,0,0,.14);cursor:pointer;font:300 17px/1 Manrope,sans-serif;color:#2E2E2E" style-hover="border-color:rgba(0,0,0,.45)">←</button>
            <button onClick="{{ navNext }}" aria-label="Nächstes Projekt" style="width:42px;height:42px;display:grid;place-items:center;background:none;border:1px solid rgba(0,0,0,.14);cursor:pointer;font:300 17px/1 Manrope,sans-serif;color:#2E2E2E" style-hover="border-color:rgba(0,0,0,.45)">→</button>
          </div>
        </div>
      </div>
      <div style="max-width:1600px;margin:0 auto;padding:0 40px">
        <div style="overflow:hidden">
        <div style="{{ trackStyle }}">
          <sc-for list="{{ others }}" as="o" hint-placeholder-count="4">
            <a href="#" onMouseEnter="{{ o.enter }}" onMouseLeave="{{ o.leave }}" style="{{ o.cardStyle }}">
              <div style="position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#F4F0E9">
                <div style="{{ o.zoomStyle }}">
                  <img src="{{ o.src }}" alt="{{ o.alt }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" />
                </div>
              </div>
              <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-top:14px">
                <span style="font:400 15px/1.3 Manrope,sans-serif;color:#2E2E2E">{{ o.name }}</span>
                <span style="font:500 11px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9A9A9A;white-space:nowrap">{{ o.ort }}</span>
              </div>
            </a>
          </sc-for>
        </div>
        </div>
      </div>
    </section>
  </main>







</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;menuSide&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;right&quot;],&quot;default&quot;:&quot;right&quot;,&quot;tsType&quot;:&quot;'left' | 'right'&quot;,&quot;section&quot;:&quot;Verhalten&quot;},&quot;galleryHeight&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:74,&quot;min&quot;:52,&quot;max&quot;:92,&quot;step&quot;:2,&quot;unit&quot;:&quot;vh&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Galerie&quot;}}">
const PROJECT = {
  title: 'Umbau Amthaus',
  ort: 'Aarberg',
  baujahr: '2015–',
  bauweise: 'Massivbau',
  typ: 'Öffentliches Gebäude',
  volumen: "7'200 m³",
  kicker: 'Realisiertes Projekt',
  description: 'Das Amthaus im historischen Ortskern von Aarberg wurde etappenweise umgebaut und den heutigen Anforderungen an ein öffentliches Gebäude angepasst. Der Massivbau bleibt in seiner Substanz erhalten; neue Einbauten ordnen die Abläufe, verbessern die Erschliessung und bringen Tageslicht in die tiefen Grundrisse. Materialwahl und Detaillierung nehmen den Bestand auf, ohne ihn zu kopieren.'
};

const SHOTS = [
  ['./uploads/_WE_4367-.jpg', 'Aussenansicht'],
  ['./uploads/_WE_4346.jpg', 'Eingangsbereich'],
  ['./uploads/_WE_4347.jpg', 'Treppenhaus'],
  ['./uploads/_WE_4424-.jpg', 'Büroraum im Obergeschoss'],
  ['./uploads/_WE_4304-.jpg', 'Detail Bestand und Einbau'],
  ['./uploads/_WE_4272-.jpg', 'Blick in den Ortskern']
];

const OTHERS = [
  ['Anbau Casutt', 'Gerolfingen', './uploads/_WE_2661-.jpg'],
  ['Anbau Schmutz', 'Täuffelen', './uploads/_WE_4287-.jpg'],
  ['Anbau Gafner', 'Kerzers', './uploads/IMG_3314.jpg'],
  ['Wohnhaus Rebhalde', 'Täuffelen', './uploads/_WE_2670-.jpg'],
  ['Umbau Scheune Bärgli', 'Suberg', './uploads/_WE_4178-.jpg'],
  ['Sanierung Altstadthaus', 'Erlach', './uploads/_WE_2696-.jpg'],
  ['Wohnhaus Weiherblick', 'Meikirch', './uploads/_WE_4266-.jpg'],
  ['Pavillon Seeuferweg', 'Wengi', './uploads/_WE_4152-.jpg']
];

class Component extends DCLogic {
  state = { shot: 0, navI: 0, hover: null, w: 1440 };

  componentDidMount() {
    this.onResize();
    window.addEventListener('resize', this.onResize);
    document.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('keydown', this.onKey);
    document.body.style.overflow = '';
  }
  onResize = () => { if (window.innerWidth !== this.state.w) this.setState({ w: window.innerWidth }); };
  onKey = (e) => {
    if (e.key === 'Escape') this.setState({ menuOpen: false, sub: null });
    if (e.key === 'ArrowRight') this.step(1);
    if (e.key === 'ArrowLeft') this.step(-1);
  };
  componentDidUpdate(pp, ps) {
    if (ps.menuOpen !== this.state.menuOpen) document.body.style.overflow = this.state.menuOpen ? 'hidden' : '';
  }

  step(dir) {
    const i = Math.min(SHOTS.length - 1, Math.max(0, this.state.shot + dir));
    if (i !== this.state.shot) this.setState({ shot: i });
  }
  onScroll = () => {};
  toggle(k) { this.setState(s => ({ sub: s.sub === k ? null : k })); }

  renderVals() {
    const { shot, navI, hover, w } = this.state;
    const mobile = w < 900;
    const perView = w < 700 ? 1 : w < 1100 ? 2 : 3;
    const maxNav = Math.max(0, OTHERS.length - perView);
    const nav = Math.min(navI, maxNav);
    const galH = this.props.galleryHeight ?? 74;

    const open = !!this.state.menuOpen;
    const side = this.props.menuSide === 'right' ? 'right' : 'left';

    return {
      title: PROJECT.title,
      kicker: PROJECT.kicker,
      ortLabel: PROJECT.ort + ', Schweiz',
      description: PROJECT.description,
      meta: [
        { label: 'Ort', value: PROJECT.ort },
        { label: 'Baujahr', value: PROJECT.baujahr },
        { label: 'Bauweise', value: PROJECT.bauweise },
        { label: 'Typ', value: PROJECT.typ },
        { label: 'Volumen', value: PROJECT.volumen }
      ],
      layoutStyle: {
        display: 'grid',
        gridTemplateColumns: mobile ? '1fr' : 'minmax(0, 40fr) minmax(0, 60fr)',
        gap: mobile ? '48px' : 'clamp(40px, 4.5vw, 80px)',
        alignItems: 'start',
        maxWidth: '1760px',
        margin: '0 auto'
      },
      galRef: null,
      onGalScroll: null,
      currentShot: SHOTS[shot] ? SHOTS[shot][0] : SHOTS[0][0],
      currentAlt: SHOTS[shot] ? PROJECT.title + ', ' + PROJECT.ort + ' — ' + SHOTS[shot][1] + ' (' + PROJECT.typ + ')' : '',
      figStyle: {
        margin: 0, width: '100%', overflow: 'hidden',
        height: mobile ? '56vh' : galH + 'vh'
      },
      arrowPrevStyle: {
        position: 'absolute', left: 0, top: '50%', transform: 'translateY(-50%)',
        width: '52px', height: '64px', display: 'grid', placeItems: 'center',
        background: 'rgba(252,250,247,0.82)', border: 'none', cursor: 'pointer',
        font: '300 22px/1 Manrope, sans-serif', color: '#2E2E2E',
        transition: 'background .25s ease'
      },
      arrowNextStyle: {
        position: 'absolute', right: 0, top: '50%', transform: 'translateY(-50%)',
        width: '52px', height: '64px', display: 'grid', placeItems: 'center',
        background: 'rgba(252,250,247,0.82)', border: 'none', cursor: 'pointer',
        font: '300 22px/1 Manrope, sans-serif', color: '#2E2E2E',
        transition: 'background .25s ease'
      },
      shotCaption: SHOTS[shot] ? SHOTS[shot][1] : '',
      shotCounter: String(shot + 1).padStart(2, '0') + ' / ' + String(SHOTS.length).padStart(2, '0'),
      galPrev: () => this.step(-1),
      galNext: () => this.step(1),

      nextTitle: OTHERS[Math.min(nav, OTHERS.length - 1)][0],
      navCounter: String(nav + 1).padStart(2, '0') + ' / ' + String(OTHERS.length).padStart(2, '0'),
      navPrev: () => this.setState({ navI: Math.max(0, nav - 1) }),
      navNext: () => this.setState({ navI: Math.min(maxNav, nav + 1) }),
      trackStyle: {
        display: 'grid',
        gridAutoFlow: 'column',
        gridAutoColumns: 'calc((100% - ' + (perView - 1) * 28 + 'px) / ' + perView + ')',
        gap: '28px',
        transform: 'translateX(calc(' + (-nav) + ' * (100% + 28px) / ' + perView + '))',
        transition: 'transform .8s cubic-bezier(.72,0,.16,1)'
      },
      others: OTHERS.map(([name, ort, src], i) => ({
        name, ort, src,
        alt: name + ', ' + ort + ' — Projekt von Wüthrich Architekten AG',
        enter: () => this.setState({ hover: i }),
        leave: () => this.setState({ hover: null }),
        cardStyle: { display: 'block', minWidth: 0, textDecoration: 'none', color: '#2E2E2E' },
        zoomStyle: {
          position: 'absolute', inset: 0,
          transform: hover === i ? 'scale(1.045)' : 'none',
          transition: 'transform 1.1s cubic-bezier(.2,.6,.1,1)'
        }
      })),

      panelStyle: {
        position: 'fixed', top: 0, bottom: 0, [side]: 0, zIndex: 220,
        width: 'min(46vw, 620px)', display: 'flex', flexDirection: 'column',
        background: 'rgba(252,250,247,0.72)',
        backdropFilter: 'blur(26px) saturate(1.1)', WebkitBackdropFilter: 'blur(26px) saturate(1.1)',
        borderRight: side === 'left' ? '1px solid rgba(0,0,0,0.10)' : 'none',
        borderLeft: side === 'right' ? '1px solid rgba(0,0,0,0.10)' : 'none',
        transform: open ? 'none' : 'translateX(' + (side === 'left' ? '-102%' : '102%') + ')',
        transition: 'transform .72s cubic-bezier(.72,0,.16,1)', overflowY: 'auto'
      },
      scrimStyle: {
        position: 'fixed', inset: 0, zIndex: 210, background: 'rgba(17,17,17,0.18)',
        opacity: open ? 1 : 0, pointerEvents: open ? 'auto' : 'none', transition: 'opacity .6s ease'
      },
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false, sub: null }),
      toggleLeistungen: () => this.toggle('leistungen'),
      toggleUeberUns: () => this.toggle('ueber'),
      toggleJobs: () => this.toggle('jobs'),
      subLeistungen: this.state.sub === 'leistungen',
      subUeberUns: this.state.sub === 'ueber',
      subJobs: this.state.sub === 'jobs'
    };
  }
}

</script>
</body>
</html>
