<script type="text/x-dc" data-dc-script data-props="">

const ROUTES = [
  ['home', 'Startseite', 'page-home'],
  ['projekte', 'Projekte', 'page-projects'],
  ['projekt', 'Projekt', 'page-detail-v1'],
  ['leistungen', 'Leistungen', 'page-services'],
  ['immobilien', 'Immobilien', 'page-realestate'],
  ['spezialgebiete', 'Spezialgebiete', 'page-specialties'],
  ['ueber-uns', 'Über uns', 'page-about'],
  ['news', 'News', 'page-news-v1'],
  ['jobs', 'Jobs', 'page-jobs'],
  ['kontakt', 'Kontakt', 'page-contact']
];
const FILE_TO_ROUTE = {
  '01 Home': 'home', '02 Projects': 'projekte', '03 Project Detail': 'projekt',
  '04 Services': 'leistungen', '05 Real Estate': 'immobilien', '06 Specialties': 'spezialgebiete',
  '07 About': 'ueber-uns', '08 News': 'news', '09 Jobs': 'jobs', '10 Contact': 'kontakt'
};

class Component extends DCLogic {
  state = { route: 'home', detailVer: 1, newsVer: 1, menuOpen: false, sub: null };

  componentDidMount() {
    this.syncHash();
    window.addEventListener('hashchange', this.syncHash);
    document.addEventListener('keydown', this.onKey);
    document.addEventListener('click', this.onDocClick, true);
  }
  componentWillUnmount() {
    window.removeEventListener('hashchange', this.syncHash);
    document.removeEventListener('keydown', this.onKey);
    document.removeEventListener('click', this.onDocClick, true);
    document.body.style.overflow = '';
  }
  componentDidUpdate(pp, ps) {
    if (ps.menuOpen !== this.state.menuOpen) document.body.style.overflow = this.state.menuOpen ? 'hidden' : '';
  }
  onKey = (e) => { if (e.key === 'Escape') this.setState({ menuOpen: false, sub: null }); };

  syncHash = () => {
    const id = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    if (id && ROUTES.some(r => r[0] === id) && id !== this.state.route) this.setState({ route: id, menuOpen: false, sub: null });
  };

  // In-content links still point at the standalone page files — keep them inside the prototype.
  onDocClick = (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    const href = decodeURIComponent(a.getAttribute('href') || '');
    const m = href.match(/([^/]+)\.dc\.html/);
    if (!m) return;
    const route = FILE_TO_ROUTE[m[1]];
    if (!route) return;
    e.preventDefault();
    e.stopPropagation();
    this.go(route);
  };

  go(route) {
    const next = { route, menuOpen: false, sub: null };
    if (route === 'projekt' && this.state.route !== 'projekt') next.detailVer = 1;
    this.setState(next);
    if (location.hash !== '#/' + route) location.hash = '#/' + route;
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  toggle(k) { this.setState(s => ({ sub: s.sub === k ? null : k })); }

  topBtn(active) {
    return {
      background: 'none', border: 0, padding: '6px 0', cursor: 'pointer',
      font: '500 12px/1 Manrope, sans-serif', letterSpacing: '.18em', textTransform: 'uppercase',
      color: active ? '#2E2E2E' : '#9A9A9A',
      borderBottom: active ? '1px solid #2E2E2E' : '1px solid transparent',
      transition: 'color .3s ease, border-color .3s ease'
    };
  }
  menuBtn(active, expandable) {
    const base = {
      display: 'flex', alignItems: 'baseline', gap: '16px', background: 'none', border: 0,
      padding: expandable ? '10px 0' : '6px 0', cursor: 'pointer', textAlign: 'left',
      font: '400 27px/1.2 Manrope, sans-serif', letterSpacing: '.26em', textTransform: 'uppercase',
      color: active ? '#9A9A9A' : '#2E2E2E', transition: 'color .3s ease'
    };
    return base;
  }
  subBtn(active) {
    return {
      background: 'none', border: 0, padding: 0, cursor: 'pointer', textAlign: 'left',
      font: '400 15px/1.4 Manrope, sans-serif', letterSpacing: '.10em',
      color: active ? '#2E2E2E' : '#6B6B6B', transition: 'color .3s ease'
    };
  }
  footBtn(active) {
    return {
      background: 'none', border: 0, padding: 0, cursor: 'pointer', textAlign: 'left',
      font: '400 16px/1.4 Manrope, sans-serif', color: active ? '#9A9A9A' : '#2E2E2E',
      transition: 'color .3s ease'
    };
  }
  segBtn(active) {
    return {
      background: active ? '#FFFFFF' : 'transparent', border: 0,
      borderRight: '1px solid rgba(0,0,0,.14)', padding: '9px 20px', cursor: 'pointer',
      font: '500 11px/1 Manrope, sans-serif', letterSpacing: '.18em', textTransform: 'uppercase',
      color: active ? '#2E2E2E' : '#9A9A9A', transition: 'background .25s ease, color .25s ease'
    };
  }

  renderVals() {
    const { route, detailVer, newsVer } = this.state;
    const open = this.state.menuOpen;
    const hasVersions = route === 'projekt' || route === 'news';
    const ver = route === 'projekt' ? detailVer : newsVer;
    const seg2 = this.segBtn(ver === 2);
    seg2.borderRight = 0;

    return {
      isHome: route === 'home',
      isProjects: route === 'projekte',
      isDetailV1: route === 'projekt' && detailVer === 1,
      isDetailV2: route === 'projekt' && detailVer === 2,
      isServices: route === 'leistungen',
      isRealEstate: route === 'immobilien',
      isSpecialties: route === 'spezialgebiete',
      isAbout: route === 'ueber-uns',
      isNewsV1: route === 'news' && newsVer === 1,
      isNewsV2: route === 'news' && newsVer === 2,
      isJobs: route === 'jobs',
      isContact: route === 'kontakt',

      hasVersions,
      showBack: route === 'projekt',
      goBack: () => this.go('projekte'),
      v1Style: this.segBtn(ver === 1),
      v2Style: seg2,
      pickV1: () => this.setState(route === 'projekt' ? { detailVer: 1 } : { newsVer: 1 }),
      pickV2: () => this.setState(route === 'projekt' ? { detailVer: 2 } : { newsVer: 2 }),

      stageStyle: { paddingTop: hasVersions ? '56px' : 0 },
      stageClass: hasVersions ? 'wa-stage wa-shift' : 'wa-stage',

      topNav: [['projekte', 'Alle Projekte'], ['news', 'News'], ['kontakt', 'Kontakt']].map(([id, label]) => ({
        label, style: this.topBtn(route === id), go: () => this.go(id)
      })),
      footerNav: ROUTES.filter(r => r[0] !== 'projekt' && r[0] !== 'home').map(([id, label]) => ({
        label, style: this.footBtn(route === id), go: () => this.go(id)
      })),

      goHome: (e) => { if (e) e.preventDefault(); this.go('home'); },
      goProjects: () => this.go('projekte'),
      goServices: () => this.go('leistungen'),
      goRealEstate: () => this.go('immobilien'),
      goSpecialties: () => this.go('spezialgebiete'),
      goAbout: () => this.go('ueber-uns'),
      goNews: () => this.go('news'),
      goJobs: () => this.go('jobs'),
      goContact: () => this.go('kontakt'),

      mProjects: this.menuBtn(route === 'projekte' || route === 'projekt', false),
      mLeistungen: this.menuBtn(route === 'leistungen' || route === 'immobilien' || route === 'spezialgebiete', true),
      mAbout: this.menuBtn(route === 'ueber-uns', true),
      mNews: this.menuBtn(route === 'news', false),
      mJobs: this.menuBtn(route === 'jobs', true),
      mContact: this.menuBtn(route === 'kontakt', false),
      sServices: this.subBtn(route === 'leistungen'),
      sRealEstate: this.subBtn(route === 'immobilien'),
      sSpecialties: this.subBtn(route === 'spezialgebiete'),
      sAbout: this.subBtn(route === 'ueber-uns'),
      sJobs: this.subBtn(route === 'jobs'),

      openMenu: () => this.setState({ menuOpen: true }),

nkLabel || '', href: b.href || '#',\n          rowStyle: {\n            display: 'grid',\n            gridTemplateColumns: mobile ? '1fr' : 'minmax(0,1.15fr) minmax(0,.85fr)',\n            gap: mobile ? '28px' : 'clamp(40px,5vw,96px)',\n            alignItems: 'center',\n            scrollMarginTop: '120px'\n          },\n          figStyle: {\n            margin: 0, order: imgRight ? 2 : 1, minWidth: 0,\n            height: mobile ? '56vw' : 'clamp(380px,44vw,660px)', overflow: 'hidden'\n          },\n          textStyle: {\n            order: imgRight ? 1 : 2, display: 'flex', flexDirection: 'column',\n            gap: '18px', minWidth: 0, paddingTop: mobile ? '4px' : 0\n          }\n        };\n      }),\n      timelineStyle: {\n        margin: 0, padding: 0, listStyle: 'none',\n        display: 'grid',\n        gridTemplateColumns: vertical ? '1fr' : 'repeat(6, minmax(0,1fr))',\n        gap: vertical ? '0' : 'clamp(20px,2.2vw,34px)',\n        borderTop: '1px solid rgba(0,0,0,.14)',\n        borderBottom: vertical ? 'none' : '1px solid rgba(0,0,0,.14)',\n        borderRight: vertical ? 'none' : '1px solid rgba(0,0,0,.14)'\n      },\n      steps: STEPS.map(([name, sub], i) => ({\n        num: String(i + 1).padStart(2, '0'),\n        name, sub,\n        style: {\n          display: 'flex', flexDirection: 'column', gap: '12px',\n          padding: vertical ? '22px 0' : '24px 0 28px',\n          borderBottom: vertical ? '1px solid rgba(0,0,0,.10)' : 'none',\n          borderLeft: vertical ? 'none' : '1px solid rgba(0,0,0,.10)',\n          paddingLeft: vertical ? 0 : 'clamp(16px,1.5vw,24px)',\n          paddingRight: vertical ? 0 : 'clamp(12px,1.1vw,20px)',\n          marginLeft: vertical ? 0 : '-1px'\n        }\n      })),\n\n      panelStyle: {\n        position: 'fixed', top: 0, bottom: 0, [side]: 0, zIndex: 220,\n        width: 'min(46vw, 620px)', display: 'flex', flexDirection: 'column',\n        background: 'rgba(252,250,247,0.72)',\n        backdropFilter: 'blu obilien-titel\" style=\"max-width:1600px;margin:0 auto;padding:0 40px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;padding-bottom:clamp(40px,5vw,74px)\">\n        <nav aria-label=\"Brotkrumen\" style=\"display:flex;align-items:center;gap:10px;font:500 11px/1 Manrope,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#9A9A9A\">\n          <a href=\"./04 Services.dc.html\" style=\"color:#9A9A9A\" style-hover=\"color:#2E2E2E\">Leistungen<\/a>\n          <span>/<\/span>\n          <span style=\"color:#6B6B6B\">Immobilien<\/span>\n        <\/nav>\n        <h1 id=\"immobilien-titel\" style=\"margin:0;font:300 clamp(40px,6.4vw,104px)/1.02 Manrope,sans-serif;letter-spacing:-.02em;color:#2E2E2E\">Immobilien<\/h1>\n      <\/div>\n\n      <div style=\"{{ introStyle }}\">\n        <div style=\"display:flex;flex-direction:column;gap:22px;max-width:68ch\">\n          <p style=\"margin:0;font:400 clamp(17px,1.35vw,20px)/1.62 Manrope,sans-serif;color:#2E2E2E\">Grundstücke entwickeln und vermitteln — neben klassischen Architekturleistungen begleiten wir auch die Entwicklung von Grundstücken und Immobilienprojekten. Dazu gehören der Kauf und Verkauf von Bauland sowie die Entwicklung und Realisierung von Gesamtprojekten.<\/p>\n          <p style=\"margin:0;font:400 17px/1.68 Manrope,sans-serif;color:#4A4A4A\">Darüber hinaus vermitteln wir Grundstücke, Wohnobjekte und Immobilien und unterstützen Eigentümer und Interessenten bei der erfolgreichen Vermarktung.<\/p>\n        <\/div>\n        <div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(0,0,0,.10);align-self:start\">\n          <a href=\"#angebote\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.10);font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B\" style-hover=\"color:#2E2E2E\">\n            <span>Aktuelle Angebote<\/span><span style=\"font:300 15px/1 Manrope,sans-serif\">↓<\/span>\n          <\/a>\n          <a href=\"#ankauf\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.10);font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B\" style-hover=\"color:#2E2E2E\">\n            <span>Ankauf<\/span><span style=\"font:300 15px/1 Manrope,sans-serif\">↓<\/span>\n          <\/a>\n          <a href=\"#verkauf\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.10);font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B\" style-hover=\"color:#2E2E2E\">\n            <span>Verkauf &amp; Vermittlung<\/span><span style=\"font:300 15px/1 Manrope,sans-serif\">↓<\/span>\n          <\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"angebote\" aria-labelledby=\"angebote-titel\" style=\"max-width:1600px;margin:0 auto;padding:clamp(70px,8vw,130px) 40px 0;scroll-margin-top:120px\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;padding-bottom:clamp(32px,3.6vw,54px);border-bottom:1px solid rgba(0,0,0,.10)\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#9A9A9A\">Immobilien<\/span>\n          <h2 id=\"angebote-titel\" style=\"margin:0;font:300 clamp(28px,3.2vw,48px)/1.06 Manrope,sans-serif;letter-spacing:-.01em;color:#2E2E2E;max-width:24ch\">Aktuelle Immobilienangebote<\/h2>\n        <\/div>\n        <span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B\">{{ countLabel }}<\/span>\n      <\/div>\n\n      <sc-if value=\"{{ hasListings }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"{{ gridStyle }}\">\n          <sc-for list=\"{{ listings }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <a href=\"#\" onMouseEnter=\"{{ l.enter }}\" onMouseLeave=\"{{ l.leave }}\" style=\"display:block;color:#2E2E2E\">\n              <div style=\"{{ l.mediaStyle }}\">\n                <div style=\"{{ l.zoomStyle }}\">\n                  <img src=\"{{ l.src }}\" alt=\"{{ l.alt }}\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block\" />\n                <\/div>\n                <span style=\"{{ l.badgeStyle }}\">{{ l.status }}<\/span>\n              <\/div>\n              <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:18px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px\">\n                  <span style=\"font:400 clamp(19px,1.5vw,23px)/1.2 Manrope,sans-serif;color:#2E2E2E\">{{ l.name }}<\/span>\n                  <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9A9A9A;white-space:nowrap\">{{ l.ort }}<\/span>\n                <\/div>\n                <p style=\"margin:0;font:400 15px/1.6 Manrope,sans-serif;color:#6B6B6B;max-width:38ch\">{{ l.body }}<\/p>\n                <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(0,0,0,.10)\">\n                  <sc-for list=\"{{ l.facts }}\" as=\"f\" hint-placeholder-count=\"3\">\n                    <li style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.10)\">\n                      <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9A9A9A\">{{ f.k }}<\/span>\n                      <span style=\"font:400 15px/1.3 Manrope,sans-serif;color:#2E2E2E\">{{ f.v }}<\/span>\n                    <\/li>\n                  <\/sc-for>\n                <\/ul>\n                <span style=\"display:inline-flex;align-items:center;gap:10px;font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#2E2E2E;padding-top:2px\">\n                  <span>Dokumentation anfordern<\/span><span style=\"font:300 15px/1 Manrope,sans-serif\">→<\/span>\n                <\/span>\n              <\/div>\n            <\/a>\n          <\/sc-for>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ noListings }}\">\n        <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:clamp(70px,8vw,120px) 0\">\n          <span style=\"font:300 clamp(24px,2.4vw,34px)/1.2 Manrope,sans-serif;color:#2E2E2E\">Derzeit keine Angebote publiziert.<\/span>\n          <p style=\"margin:0;font:400 16px/1.65 Manrope,sans-serif;color:#6B6B6B;max-width:48ch\">Gerne nehmen wir Ihre Suchkriterien auf und melden uns, sobald ein passendes Objekt verfügbar ist.<\/p>\n          <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:12px;font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#2E2E2E;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:8px;margin-top:10px\" style-hover=\"color:#6B6B6B\">\n            <span>Suchprofil hinterlegen<\/span><span style=\"font:300 15px/1 Manrope,sans-serif\">→<\/span>\n          <\/a>\n        <\/div>\n      <\/sc-if>\n    <\/section>\n\n    <section id=\"ankauf\" aria-labelledby=\"ankauf-titel\" style=\"{{ splitStyle }}\">\n      <figure style=\"{{ ankaufFigStyle }}\">\n        <img src=\"./assets/_WE_4304-.jpg\" alt=\"Landwirtschaftliche Liegenschaft im Berner Seeland — Ankauf von Grundstücken, Wüthrich Architekten AG\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block;background:#F4F0E9\" />\n      <\/figure>\n      <div style=\"{{ ankaufTextStyle }}\">\n        <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#9A9A9A\">Ankauf<\/span>\n        <h2 id=\"ankauf-titel\" style=\"margin:0;font:300 clamp(28px,2.9vw,44px)/1.08 Manrope,sans-serif;letter-spacing:-.01em;color:#2E2E2E;max-width:18ch\">Ankauf von Grundstücken &amp; Liegenschaften<\/h2>\n        <p style=\"margin:0;max-width:48ch;font:400 17px/1.68 Manrope,sans-serif;color:#4A4A4A\">Wir kaufen Bauland, Entwicklungsareale und bestehende Liegenschaften im Berner Seeland und in der Region Bern — direkt, diskret und mit klarer Einschätzung des Potenzials.<\/p>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(0,0,0,.10);max-width:460px\">\n          <li style=\"padding:13px 0;border-bottom:1px solid rgba(0,0,0,.10);font:400 15px/1.4 Manrope,sans-serif;color:#2E2E2E\">Bauland und Entwicklungsareale<\/li>\n          <li style=\"padding:13px 0;border-bottom:1px solid rgba(0,0,0,.10);font:400 15px/1.4 Manrope,sans-serif;color:#2E2E2E\">Bestehende Wohn- und Gewerbeliegenschaften<\/li>\n          <li style=\"padding:13px 0;border-bottom:1px solid rgba(0,0,0,.10);font:400 15px/1.4 Manrope,sans-serif;color:#2E2E2E\">Landwirtschaftliche Objekte mit Umnutzungspotenzial<\/li>\n          <li style=\"padding:13px 0;border-bottom:1px solid rgba(0,0,0,.10);font:400 15px/1.4 Manrope,sans-serif;color:#2E2E2E\">Machbarkeitsstudie und Ausnutzungsprüfung<\/li>\n        <\/ul>\n        <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:12px;font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#2E2E2E;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:8px;align-self:flex-start\" style-hover=\"color:#6B6B6B\">\n          <span>Objekt anbieten<\/span><span style=\"font:300 15px/1 Manrope,sans-serif\">→<\/span>\n        <\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"verkauf\" aria-labelledby=\"verkauf-titel\" style=\"margin-top:clamp(90px,10vw,160px);border-top:1px solid rgba(0,0,0,.10);background:#F4F0E9;scroll-margin-top:120px\">\n      <div style=\"max-width:1600px;margin:0 auto;padding:clamp(56px,6vw,96px) 40px clamp(70px,8vw,120px)\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;padding-bottom:clamp(40px,4.5vw,68px)\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:#9A9A9A\">Verkauf &amp; Vermittlung<\/span>\n            <h2 id=\"verkauf-titel\" style=\"margin:0;font:300 clamp(28px,3.2vw,48px)/1.06 Manrope,sans-serif;letter-spacing:-.01em;color:#2E2E2E;max-width:22ch\">Von der Bewertung bis zur Beurkundung<\/h2>\n          <\/div>\n          <span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B\">Vier Schritte<\/span>\n        <\/div>\n\n        <ol style=\"{{ timelineStyle }}\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <li style=\"{{ s.style }}\">\n              <span style=\"font:300 clamp(30px,2.8vw,42px)/1 Manrope,sans-serif;color:#B4ADA0\">{{ s.num }}<\/span>\n              <span style=\"font:500 14px/1.3 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#2E2E2E\">{{ s.name }}<\/span>\n              <span style=\"font:400 15px/1.55 Manrope,sans-serif;color:#6B6B6B;max-width:26ch\">{{ s.sub }}<\/span>\n            <\/li>\n          <\/sc-for>\n        <\/ol>\n\n        <p style=\"margin:clamp(40px,4.5vw,64px) 0 0;font:400 17px/1.68 Manrope,sans-serif;color:#4A4A4A;max-width:62ch\">Als Architekten kennen wir den Wert eines Objekts nicht nur am Markt, sondern auch in der Substanz. Diese Doppelsicht bringen wir in jede Vermarktung ein — von der Grundstücksparzelle bis zum Mehrfamilienhaus.<\/p>\n      <\/div>\n    <\/section>\n\n    <section aria-label=\"Kontakt\" style=\"max-width:1600px;margin:0 auto;padding:clamp(80px,9vw,150px) 40px clamp(90px,10vw,150px);display:flex;flex-direction:column;gap:26px;ali  Oberengadin.',\n   'Freitagmorgen mit dem Zug los, Samstagabend wieder zurück. Zwischen Sils und Soglio haben wir Ställe, Sgraffito-Fassaden und den Neubau eines Kollegen besichtigt. Am Abend gab es Capuns und eine lange Diskussion über Holz im Bestand.',\n   './assets/_WE_2670-.jpg'],\n  ['2026-04-14', 'mitarbeiter', 'Nadine Blaser verstärkt die Bauleitung',\n   'Seit April ergänzt Nadine Blaser unser Team als Bauleiterin.',\n   'Nadine Blaser bringt zwölf Jahre Erfahrung aus Umbauten im bewohnten Zustand mit und übernimmt bei uns die Bauleitung für zwei laufende Sanierungen. Sie ist in Aarberg aufgewachsen — Ortskenntnis inklusive.',\n   null],\n  ['2026-03-09', 'pruefung', 'Lena Roth ist diplomierte Bauleiterin',\n   'Bestanden — und das mit einer Diplomarbeit über Sanierungen im Bestand.',\n   'Zwei Jahre Weiterbildung neben der Arbeit, jetzt das Diplom. Ihre Arbeit untersuchte, wie sich Sanierungsetappen in bewohnten Mehrfamilienhäusern planen lassen, ohne die Mieterschaft auszuquartieren. Wir gratulieren herzlich.',\n   null],\n  ['2026-02-02', 'projekte', 'Neues Mandat: Erweiterung Gemeindehaus Schüpfen',\n   'Die Gemeinde Schüpfen hat uns mit der Erweiterung ihres Gemeindehauses beauftragt.',\n   'Der Bestand aus den 1960er-Jahren wird nicht ersetzt, sondern ergänzt: ein schlanker Anbau nach Süden schafft Platz für Schalter und Sitzungszimmer, das bestehende Treppenhaus bleibt das Herz des Gebäudes.',\n   './assets/_WE_4424-.jpg'],\n  ['2025-12-19', 'ausfluege', 'Weihnachtsessen im Bielersee-Rebberg',\n   'Fondue, Jahresrückblick und ein Rundgang durch drei fertige Bauten.',\n   'Bevor gegessen wurde, sind wir gemeinsam durch die drei diesjährigen Fertigstellungen gelaufen. Danach: Fondue in Twann und die traditionelle Bilderrunde mit den schlechtesten Baustellenfotos des Jahres.',\n   null],\n  ['2025-11-11', 'projekte', 'Amtshaus Aarberg — Sanierung abgeschlossen',\n   'Nach 18 Monaten ist das Amtshaus wieder in Betrieb.',\n   'Die Fassade wurde instandgestellt, die Fenster nach historischem Vorbild ersetzt und die Haustechnik vollständig erneuert. Die Gerichtssäle im Obergeschoss haben ihre ursprüngliche Raumhöhe zurückerhalten.',\n   './assets/_WE_4346.jpg'],\n  ['2025-10-06', 'mitarbeiter', 'Tim Gerber beginnt seine Lehre',\n   'Neuer Lernender Zeichner EFZ Fachrichtung Architektur.',\n   'Tim Gerber hat im August seine vierjährige Lehre bei uns begonnen. Er arbeitet von Anfang an im Projektteam mit — erste Aufgabe: Bestandsaufnahme eines Bauernhauses in Kappelen.',\n   null],\n  ['2025-09-15', 'pruefung', 'Marc Lüthi besteht die Feng-Shui-Zertifizierung',\n   'Unser Spezialgebiet hat Verstärkung: Marc Lüthi ist zertifizierter Berater.',\n   'Die Ausbildung umfasste 180 Stunden und schloss mit einer Fallstudie zu einem Einfamilienhaus in Täuffelen ab. Damit können wir Feng-Shui-Beratung durchgehend intern anbieten.',\n   null],\n  ['2025-08-21', 'projekte', 'Werkhalle Industriering Kallnach übergeben',\n   'Eine Halle mit 1400 m² Nutzfläche — und einer Holzkonstruktion, die man sieht.',\n   'Statt eines Stahlbaus haben wir eine sichtbare Brettschichtholz-Konstruktion vorgeschlagen. Die Bauherrschaft hat mitgemacht, obwohl es ungewohnt war. Das Ergebnis ist eine Werkhalle, in der man gerne arbeitet.',\n   './assets/IMG_3307.jpg'],\n  ['2025-07-04', 'ausfluege', 'Sommerfest mit Familien in Gerolfingen',\n   'Grillieren am See, Kinder im Wasser, Bürohunde im Schatten.',\n   'Einmal im Sommer laden wir alle Angehörigen ein. Dieses Jahr am Seeufer bei Gerolfingen — mit Grill, Boot und einem Wettbewerb im Turmbauen aus Bauklötzen, der ernster wurde als geplant.',\n   './assets/_WE_2678-.jpg'],\n  ['2025-05-28', 'mitarbeiter', 'Sarah Kunz übernimmt die Immobilienbewirtschaftung',\n   'Ab Juni verantwortet Sarah Kunz unsere Verwaltungsmandate.',\n   'Sarah Kunz ist eidg. dipl. Immobilienbewirtschafterin und war zuvor zehn Jahre in Biel tätig. Sie ist die neue Ansprechperson für Eigentümerinnen und Mieterschaft.',\n   null],\n  ['2025-04-08', 'projekte', 'Baueingabe Kindergarten Hofmatt, Grossaffoltern',\n   'Ein eingeschossiger Holzbau um einen geschützten Aussenraum.',\n   'Der Kindergarten fasst zwei Abteilungen und legt sich L-förmig um einen Hof. Alle Räume sind direkt nach draussen orientiert, das weit vorgezogene Dach dient als Wetterschutz und Spielfläche.',\n   './assets/_WE_4178-.jpg'],\n  ['2025-02-17', 'pruefung', 'Zwei bestandene Abschlussprüfungen',\n   'Jael Wyss und Fabio Renz haben ihre Lehre als Zeichner EFZ abgeschlossen.',\n   'Beide bleiben dem Büro erhalten: Jael Wyss steigt ins Projektteam ein, Fabio Renz begleitet eine Baustelle in Lyss. Wir sind stolz auf zwei starke Abschlüsse.',\n   null],\n  ['2024-12-12', 'ausfluege', 'Exkursion Baubiologie in Freiburg im Breisgau',\n   'Ein Tag zwischen Lehmputz, Zellulose und ehrlichen Detailschnitten.',\n   'Fünf Mitarbeitende haben Fachvorträge zu schadstofffreiem Bauen besucht und danach zwei Wohnbauten in Strohbauweise besichtigt. Einiges davon fliesst direkt in unsere laufenden Projekte ein.',\n   null],\n  ['2024-10-23', 'projekte', 'Atelierhaus Seematte, Nidau — bezogen',\n   'Vier Ateliers, ein gemeinsamer Hof, eine sehr geduldige Bauherrschaft.',\n   'Das Atelierhaus ersetzt eine Garagenzeile am Rand der Seematte. Die Ateliers lassen sich zusammenschalten oder trennen — das Erdgeschoss ist bewusst roh belassen.',\n   './assets/_WE_4266-.jpg'],\n  ['2024-09-05', 'mitarbeiter', 'Elias Frei ergänzt das Projektteam',\n   'Architekt MSc, zuvor in Zürich, seit September im Seeland.',\n   'Elias Frei hat an der ETH studiert und vier Jahre in einem Zürcher Büro gearbeitet. Bei uns betreut er die Wohnüberbauung Bielstrasse in Bargen von der Ausschreibung bis zur Ausführung.',\n   null],\n  ['2024-07-16', 'projekte', 'Umbau Bauernhaus Chräjeloch, Kappelen',\n   'Aus Stall wird Wohnraum — ohne dass man das Haus verliert.',\n   'Der Wohnteil bleibt weitgehend original, der Ökonomieteil erhält eine eingestellte Holzstruktu at: Erweiterung Gemeindehaus Schüpfen',\n   'Die Gemeinde Schüpfen hat uns mit der Erweiterung ihres Gemeindehauses beauftragt.',\n   'Der Bestand aus den 1960er-Jahren wird nicht ersetzt, sondern ergänzt: ein schlanker Anbau nach Süden schafft Platz für Schalter und Sitzungszimmer, das bestehende Treppenhaus bleibt das Herz des Gebäudes.',\n   './assets/_WE_4424-.jpg'],\n  ['2025-12-19', 'ausfluege', 'Weihnachtsessen im Bielersee-Rebberg',\n   'Fondue, Jahresrückblick und ein Rundgang durch drei fertige Bauten.',\n   'Bevor gegessen wurde, sind wir gemeinsam durch die drei diesjährigen Fertigstellungen gelaufen. Danach: Fondue in Twann und die traditionelle Bilderrunde mit den schlechtesten Baustellenfotos des Jahres.',\n   null],\n  ['2025-11-11', 'projekte', 'Amtshaus Aarberg — Sanierung abgeschlossen',\n   'Nach 18 Monaten ist das Amtshaus wieder in Betrieb.',\n   'Die Fassade wurde instandgestellt, die Fenster nach historischem Vorbild ersetzt und die Haustechnik vollständig erneuert. Die Gerichtssäle im Obergeschoss haben ihre ursprüngliche Raumhöhe zurückerhalten.',\n   './assets/_WE_4346.jpg'],\n  ['2025-10-06', 'mitarbeiter', 'Tim Gerber beginnt seine Lehre',\n   'Neuer Lernender Zeichner EFZ Fachrichtung Architektur.',\n   'Tim Gerber hat im August seine vierjährige Lehre bei uns begonnen. Er arbeitet von Anfang an im Projektteam mit — erste Aufgabe: Bestandsaufnahme eines Bauernhauses in Kappelen.',\n   null],\n  ['2025-09-15', 'pruefung', 'Marc Lüthi besteht die Feng-Shui-Zertifizierung',\n   'Unser Spezialgebiet hat Verstärkung: Marc Lüthi ist zertifizierter Berater.',\n   'Die Ausbildung umfasste 180 Stunden und schloss mit einer Fallstudie zu einem Einfamilienhaus in Täuffelen ab. Damit können wir Feng-Shui-Beratung durchgehend intern anbieten.',\n   null],\n  ['2025-08-21', 'projekte', 'Werkhalle Industriering Kallnach übergeben',\n   'Eine Halle mit 1400 m² Nutzfläche — und einer Holzkonstruktion, die man sieht.',\n   'Statt eines Stahlbaus haben wir eine sichtbare Brettschichtholz-Konstruktion vorgeschlagen. Die Bauherrschaft hat mitgemacht, obwohl es ungewohnt war. Das Ergebnis ist eine Werkhalle, in der man gerne arbeitet.',\n   './assets/IMG_3307.jpg'],\n  ['2025-07-04', 'ausfluege', 'Sommerfest mit Familien in Gerolfingen',\n   'Grillieren am See, Kinder im Wasser, Bürohunde im Schatten.',\n   'Einmal im Sommer laden wir alle Angehörigen ein. Dieses Jahr am Seeufer bei Gerolfingen — mit Grill, Boot und einem Wettbewerb im Turmbauen aus Bauklötzen, der ernster wurde als geplant.',\n   './assets/_WE_2678-.jpg'],\n  ['2025-05-28', 'mitarbeiter', 'Sarah Kunz übernimmt die Immobilienbewirtschaftung',\n   'Ab Juni verantwortet Sarah Kunz unsere Verwaltungsmandate.',\n   'Sarah Kunz ist eidg. dipl. Immobilienbewirtschafterin und war zuvor zehn Jahre in Biel tätig. Sie ist die neue Ansprechperson für Eigentümerinnen und Mieterschaft.',\n   null],\n  ['2025-04-08', 'projekte', 'Baueingabe Kindergarten Hofmatt, Grossaffoltern',\n   'Ein eingeschossiger Holzbau um einen geschützten Aussenraum.',\n   'Der Kindergarten fasst zwei Abteilungen und legt sich L-förmig um einen Hof. Alle Räume sind direkt nach draussen orientiert, das weit vorgezogene Dach dient als Wetterschutz und Spielfläche.',\n   './assets/_WE_4178-.jpg'],\n  ['2025-02-17', 'pruefung', 'Zwei bestandene Abschlussprüfungen',\n   'Jael Wyss und Fabio Renz haben ihre Lehre als Zeichner EFZ abgeschlossen.',\n   'Beide bleiben dem Büro erhalten: Jael Wyss steigt ins Projektteam ein, Fabio Renz begleitet eine Baustelle in Lyss. Wir sind stolz auf zwei starke Abschlüsse.',\n   null],\n  ['2024-12-12', 'ausfluege', 'Exkursion Baubiologie in Freiburg im Breisgau',\n   'Ein Tag zwischen Lehmputz, Zellulose und ehrlichen Detailschnitten.',\n   'Fünf Mitarbeitende haben Fachvorträge zu schadstofffreiem Bauen besucht und danach zwei Wohnbauten in Strohbauweise besichtigt. Einiges davon fliesst direkt in unsere laufenden Projekte ein.',\n   null],\n  ['2024-10-23', 'projekte', 'Atelierhaus Seematte, Nidau — bezogen',\n   'Vier Ateliers, ein gemeinsamer Hof, eine sehr geduldige Bauherrschaft.',\n   'Das Atelierhaus ersetzt eine Garagenzeile am Rand der Seematte. Die Ateliers lassen sich zusammenschalten oder trennen — das Erdgeschoss ist bewusst roh belassen.',\n   './assets/_WE_4266-.jpg'],\n  ['2024-09-05', 'mitarbeiter', 'Elias Frei ergänzt das Projektteam',\n   'Architekt MSc, zuvor in Zürich, seit September im Seeland.',\n   'Elias Frei hat an der ETH studiert und vier Jahre in einem Zürcher Büro gearbeitet. Bei uns betreut er die Wohnüberbauung Bielstrasse in Bargen von der Ausschreibung bis zur Ausführung.',\n   null],\n  ['2024-07-16', 'projekte', 'Umbau Bauernhaus Chräjeloch, Kappelen',\n   'Aus Stall wird Wohnraum — ohne dass man das Haus verliert.',\n   'Der Wohnteil bleibt weitgehend original, der Ökonomieteil erhält eine eingestellte Holzstruktur mit zwei Wohnungen. Die alte Fassade behält ihre Öffnungen; neues Glas sitzt dahinter zurückversetzt.',\n   './assets/_WE_4304-.jpg'],\n  ['2024-05-14', 'pruefung', 'Anna Steiner ist eidg. dipl. Architektin',\n   'Nachdiplomstudium abgeschlossen, Fachrichtung Bauen im Bestand.',\n   'Anna Steiner hat ihre Diplomarbeit über die energetische Sanierung von Altstadthäusern geschrieben — ein Thema, das in Erlach und Aarberg direkt auf unserem Tisch liegt.',\n   null],\n  ['2024-03-20', 'ausfluege', 'Skitag auf dem Chasseral',\n   'Frühstart, Nebelmeer, und ein Büro, das sich einmal draussen sieht.',\n   'Ein Tag Langlauf und Schneeschuhwandern auf dem Chasseral, Znüni aus dem Rucksack, Suppe in der Métairie. Kein Programm, keine Präsentationen — nur einmal alle zusammen im Schnee.',\n   './assets/_WE_2696-.jpg']\n];\n\nconst CATS = [\n  ['alle', 'Alle'],\n  ['projekte', 'Neue Projekte'],\n  ['pruefung', 'Bestandene Prüfung'],\n  ['mitarbeiter', 'Neuer Mitarbeiter'],\n  ['ausfluege', 'Büroausflüge']\n];\nconst CAT_LABEL = {\n  projekte: 'Neues Projekt', pruefung: 'Bestandene Prü height: '34%',\n          display: 'flex', flexDirection: 'column', alignItems: 'center',\n          justifyContent: 'center', textAlign: 'center', gap: '10px', padding: '20px 24px',\n          background: 'linear-gradient(to top, rgba(17,17,17,.52) 0%, rgba(17,17,17,.34) 60%, rgba(17,17,17,.22) 100%)',\n          backdropFilter: on ? 'blur(20px)' : 'blur(0px)',\n          WebkitBackdropFilter: on ? 'blur(20px)' : 'blur(0px)',\n          maskImage: 'linear-gradient(to top, #000 0%, #000 62%, rgba(0,0,0,0) 100%)',\n          WebkitMaskImage: 'linear-gradient(to top, #000 0%, #000 62%, rgba(0,0,0,0) 100%)',\n          opacity: on ? 1 : 0, pointerEvents: 'none',\n          transition: 'opacity .35s ease, backdrop-filter .35s ease, -webkit-backdrop-filter .35s ease'\n        }\n      });\n      b.h += ratio + 0.09;\n    });\n\n    return {\n      columns: buckets,\n      isEmpty: all.length === 0,\n      countLabel: all.length + (all.length === 1 ? ' Beitrag' : ' Beiträge'),\n      hasMore: all.length > list.length,\n      shownLabel: list.length + ' von ' + all.length,\n      loadMore: () => this.setState(st => ({ limit: (st.limit ?? batch) + batch })),\n      cats: CATS.map(([id, label]) => ({\n        label, style: this.chip(cat === id), pick: () => this.setState({ cat: id, limit: null })\n      })),\n      art: {\n        cat: CAT_LABEL[cur.catId], iso: cur.iso, dateLabel: cur.dateLabel,\n        title: cur.title, lead: cur.lead, body: cur.body,\n        src: cur.src, hasPhoto: !!cur.src, noPhoto: !cur.src,\n        readerSlotId: cur.slotId + '-full',\n        alt: cur.title + ' — Wüthrich Architekten AG',\n        slotHint: CAT_LABEL[cur.catId] + ' — ' + cur.title\n      },\n      prevStyle: Object.assign(this.navBtn(), { opacity: openIdx < ALL.length - 1 ? 1 : .3 }),\n      nextStyle: Object.assign(this.navBtn(), { opacity: openIdx > 0 ? 1 : .3 }),\n      prevArticle: () => { if (openIdx < ALL.length - 1) this.setState({ open: ALL[openIdx + 1].key }); },\n      ne   const open = !!this.state.expanded[j.id];\n    const mail = this.props.contactEmail || MAIL;\n    const ratio = this.props.imageRatio || '3 / 4';\n    return {\n      key: j.id, field: j.field, place: j.place, title: j.title, lead: j.lead,\n      pensum: j.pensum, start: j.start, type: j.type,\n      src: j.src, hasPhoto: !!j.src, noPhoto: !j.src, slotId: 'wa-job-' + j.id,\n      alt: j.title + ' — Wüthrich Architekten AG, ' + j.place,\n      tasks: j.tasks, profile: j.profile, expanded: open,\n      mailto: 'mailto:' + mail + '?subject=' + encodeURIComponent('Bewerbung: ' + j.title),\n      toggle: () => this.setState(s => ({ expanded: Object.assign({}, s.expanded, { [j.id]: !s.expanded[j.id] }) })),\n      moreLabel: open ? 'Weniger anzeigen' : 'Details ansehen',\n      moreStyle: {\n        background: 'none', border: 0, padding: '4px 0', cursor: 'pointer',\n        font: '500 12px/1 Manrope, sans-serif', letterSpacing: '.16em',\n        textTransform: 'uppercase', color: open ? '#2E2E2E' : '#6B6B6B',\n        borderBottom: '1px solid ' + (open ? '#2E2E2E' : 'rgba(0,0,0,.18)'),\n        transition: 'color .3s ease, border-color .3s ease'\n      },\n      mediaStyle: { position: 'relative', width: '100%', aspectRatio: ratio, overflow: 'hidden', background: '#F4F0E9' },\n      zoomStyle: { position: 'absolute', inset: 0 }\n    };\n  }\n\n  renderVals() {\n    const showLehr = this.props.showLehrstellen !== false;\n    const lehr = showLehr ? LEHR : [];\n    const total = OFFENE.length + lehr.length;\n    const mail = this.props.contactEmail || MAIL;\n    const menu = this.state.menuOpen;\n    return {\n      offene: OFFENE.map(j => this.row(j)),\n      lehr: lehr.map(j => this.row(j)),\n      openCount: OFFENE.length + (OFFENE.length === 1 ? ' Stelle' : ' Stellen'),\n      apprCount: lehr.length + (lehr.length === 1 ? ' Angebot' : ' Angebote'),\n      countLabel: total + (total === 1 ? ' Ausschreibung' : ' Ausschreibungen'),\n      spontanMail: 'mailto:' + mail + 500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">E-Mail<\/span>\n            <a href=\"mailto:info@wuethrich-architekten.ch\" style=\"font:400 17px/1.5 Manrope,sans-serif;color:#2E2E2E;word-break:break-word\" style-hover=\"color:#6B6B6B\">info@wuethrich-architekten.ch<\/a>\n          <\/div>\n        <\/div>\n\n        <div style=\"display:flex;flex-direction:column;gap:18px;border-top:1px solid rgba(0,0,0,.10);padding-top:28px\">\n          <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">Öffnungszeiten<\/span>\n          <dl style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ hours }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(0,0,0,.06);padding-bottom:11px\">\n                <dt style=\"font:400 16px/1.4 Manrope,sans-serif;color:#2E2E2E\">{{ h.day }}<\/dt>\n                <dd style=\"margin:0;font:400 16px/1.4 Manrope,sans-serif;color:#6B6B6B;text-align:right\">{{ h.time }}<\/dd>\n              <\/div>\n            <\/sc-for>\n          <\/dl>\n          <p style=\"margin:0;font:400 14px/1.6 Manrope,sans-serif;color:#9A9A9A;max-width:44ch\">Termine ausserhalb der Bürozeiten sind nach Absprache möglich — auch abends und samstags.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"wa-split\" style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start;border-top:1px solid rgba(0,0,0,.10);padding-top:56px\">\n      <h2 style=\"margin:0;font:400 clamp(26px,2.6vw,34px)/1.1 Manrope,sans-serif;color:#2E2E2E;max-width:18ch\">Anreise<\/h2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px\">\n        <sc-for list=\"{{ travel }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B\">{{ t.label }}<\/span>\n            <p style=\"margin:0;font:400 16px/1.7 Manrope,sans-serif;color:#6B6B6B\">{{ t.text }}<\/p>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n\n    <section class=\"wa-split\" style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start;border-top:1px solid rgba(0,0,0,.10);padding-top:56px\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">Ab 2026<\/span>\n        <h2 style=\"margin:0;font:400 clamp(26px,2.6vw,34px)/1.1 Manrope,sans-serif;color:#2E2E2E;max-width:18ch\">Neuer Standort in Sutz<\/h2>\n      <\/div>\n      <div class=\"wa-two\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <p style=\"margin:0;font:400 16px/1.7 Manrope,sans-serif;color:#6B6B6B;max-width:52ch\">Im Sommer 2026 ziehen wir nach Sutz am Bielersee — näher am See, mit mehr Platz für Modellbau, Materialien und Besprechungen. Telefonnummer und E-Mail-Adressen bleiben unverändert.<\/p>\n          <address style=\"font:400 17px/1.7 Manrope,sans-serif;color:#2E2E2E;font-style:normal;border-top:1px solid rgba(0,0,0,.10);padding-top:20px\">\n            Seestrasse 4<br>\n            2572 Sutz-Lattrigen<br>\n            ab August 2026\n          <\/address>\n        <\/div>\n        <div style=\"position:relative;width:100%;aspect-ratio:4 / 3;overflow:hidden;background:#F4F0E9\">\n          <img src=\"./assets/_WE_4367-.jpg\" alt=\"Neuer Standort Sutz-Lattrigen am Bielersee — Wüthrich Architekten AG\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n      <section class=\"wa-split\" style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start;border-top:1px solid rgba(0,0,0,.10);padding-top:56px\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <h2 style=\"margin:0;font:400 clamp(26px,2.6vw,34px)/1.1 Manrope,sans-serif;color:#2E2E2E;max-width:18ch\">Schreiben Sie uns<\/h2>\n          <p style=\"margin:0;font:400 16px/1.7 Manrope,sans-serif;color:#6B6B6B;max-width:40ch\">Wir antworten innerhalb von zwei Arbeitstagen. Für dringende Anliegen rufen Sie uns besser an.<\/p>\n        <\/div>\n        <form onSubmit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:30px;max-width:720px\">\n          <div class=\"wa-two\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px\">\n            <label style=\"display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">Name<\/span>\n              <input type=\"text\" name=\"name\" required placeholder=\"Vor- und Nachname\" style=\"border:0;border-bottom:1px solid rgba(0,0,0,.18);background:none;padding:10px 0;min-height:44px;font:400 16px/1.4 Manrope,sans-serif;color:#2E2E2E;outline:none\" style-focus=\"border-bottom-color:#2E2E2E\">\n            <\/label>\n            <label style=\"display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">E-Mail<\/span>\n              <input type=\"email\" name=\"email\" required placeholder=\"name@beispiel.ch\" style=\"border:0;border-bottom:1px solid rgba(0,0,0,.18);background:none;padding:10px 0;min-height:44px;font:400 16px/1.4 Manrope,sans-serif;color:#2E2E2E;outline:none\" style-focus=\"border-bottom-color:#2E2E2E\">\n            <\/label>\n            <label style=\"display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">Telefon (optional)<\/span>\n              <input type=\"tel\" name=\"phone\" placeholder=\"+41 79 000 00 00\" style=\"border:0;border-bottom:1px solid rgba(0,0,0,.18);background:none;padding:10px 0;min-height:44px;font:400 16px/1.4 Manrope,sans-serif;color:#2E2E2E;outline:none\" style-focus=\"border-bottom-color:#2E2E2E\">\n            <\/label>\n            <label style=\"display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">Anliegen<\/span>\n              <select name=\"topic\" style=\"border:0;border-bottom:1px solid rgba(0,0,0,.18);background:none;padding:10px 0;min-height:44px;font:400 16px/1.4 Manrope,sans-serif;color:#2E2E2E;outline:none;border-radius:0\" style-focus=\"border-bottom-color:#2E2E2E\">\n                <option>Neubau<\/option>\n                <option>Umbau oder Sanierung<\/option>\n                <option>Bauleitung<\/option>\n                <option>Immobilien<\/option>\n                <option>Feng Shui / Baubiologie<\/option>\n                <option>Anderes<\/option>\n              <\/select>\n            <\/label>\n          <\/div>\n          <label style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font:500 11px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9A9A9A\">Nachricht<\/span>\n            <textarea name=\"message\" rows=\"5\" required placeholder=\"Worum geht es? Ort, Grundstück, Zeitrahmen.\" style=\"border:0;border-bottom:1px solid rgba(0,0,0,.18);background:none;padding:10px 0;font:400 16px/1.6 Manrope,sans-serif;color:#2E2E2E;outline:none;resize:vertical\" style-focus=\"border-bottom-color:#2E2E2E\"><\/textarea>\n          <\/label>\n          <div style=\"display:flex;align-items:center;gap:32px;flex-wrap:wrap;padding-top:4px\">\n            <button type=\"submit\" style=\"display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:12px 26px;background:#2E2E2E;color:#FCFAF7;border:0;cursor:pointer;font:500 12px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase\" style-hover=\"background:#6B6B6B\">\n              <span>Nachricht senden<\/span>\n              <span>→<\/span>\n            <\/button>\n            <span style=\"{{ noteStyle }}\">{{ note }}<\/span>\n          <\/div>\n        <\/form>\n      <\/section>\n    <\/sc-if>\n\n  <\/main>\n\n\n\n\n\n\n\n<\/div>\n\n","\nconst HOURS = [\n  ['Montag – Donnerstag', '08.00 – 12.00 · 13.30 – 17.30'],\n  ['Freitag', '08.00 – 12.00 · 13.30 – 16.00'],\n  ['Samstag / Sonntag', 'geschlossen']\n];\n\nconst TRAVEL = [\n  ['Mit dem Zug', 'Ab Bern oder Biel bis Bahnhof Aarberg, danach vier Minuten zu Fuss durch die Altstadtgasse.'],\n  ['Mit dem Auto', 'A1 Ausfahrt Kirchberg oder Lyss, dann Richtung Aarberg. Besucherparkplätze hinter dem Bürogebäude.'],\n  ['Mit dem Velo', 'Direkt am Seeland-Radweg. Abstellplätze und Ladestation im Innenhof.']\n];\n\nclass Component extends DCLogic {\n  state = { menuOpen: false, sub: null, sent: false };\n\n  componentWillUnmount() {\n    document.removeEventListener('keydown', this.onKey);\n    document.body.style.overflow = '';\n  }\n  onKey = (e) => { if (e.key === 'Escape') this.setState({ menuOpen: false, sub: null }); };\n  componentDidUpdate(pp, ps) {\n    if (this.state.menuOpen !== ps.menuOpen) {\n      document.body.style.overflow = this.state.menuOpen ? 'hidden' : '';\n      if (this.state.menuOpen) document.addEventListener('keydown', this.onKey);\n      else document.removeEventListener('keydown', this.onKey);\n    }\n  }\n  toggleSub(k) { this.setState(s => ({ sub: s.sub === k ? null : k })); }\n\n  renderVals() {\n    const menu = this.state.menuOpen;\n    const sent = this.state.sent;\n    return {\n      hours: HOURS.map(h => ({ key: h[0], day: h[0], time: h[1] })),\n      travel: TRAVEL.map(t => ({ key: t[0], label: t[0], text: t[1] })),\n      mapRatio: this.props.mapRatio || '16 / 10',\n      mapsLink: 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent('Bahnhofstrasse 12, 3270 Aarberg, Schweiz'),\n      showForm: this.props.showForm !== false,\n      onSubmit: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n      note: sent ? 'Danke — wir melden uns innerhalb von zwei Arbeitstagen.' : 'Oder direkt: info@wuethrich-architekten.ch',\n      noteStyle: {\n        font: '400 15px/1.5 Manrope, sans-serif',\n        color: sent ? '#2E2E2E' : '#9A9A9A',\n        transition: 'color .3s ease'\n      },\n      openMenu: () => this.setState({ menuOpen: true }),\n      closeMenu: () => this.setState({ menuOpen: false, sub: null }),\n      toggleLeistungen: () => this.toggleSub('leistungen'),\n      toggleUeberUns: () => this.toggleSub('ueber'),\n      toggleJobs: () => this.toggleSub('jobs'),\n      subLeistungen: this.state.sub === 'leistungen',\n      subUeberUns: this.state.sub === 'ueber',\n      subJobs: this.state.sub === 'jobs',\n      scrimStyle: {\n        position: 'fixed', inset: 0, zIndex: 210, background: 'rgba(17,17,17,0.18)',\n        opacity: menu ? 1 : 0, pointerEvents: menu ? 'auto' : 'none',\n        transition: 'opacity .6s ease'\n      },\n      panelStyle: {\n        position: 'fixed', top: 0, bottom: 0, right: 0, zIndex: 240,\n        width: 'min(46vw, 620px)', display: 'flex', flexDirection: 'column',\n        background: 'rgba(252,250,247,0.72)',\n        backdropFilter: 'blur(26px) saturate(1.1)', WebkitBackdropFilter: 'blur(26px) saturate(1.1)',\n        borderLeft: '1px solid rgba(0,0,0,0.10)',\n        transform: menu ? 'none' : 'translateX(102%)',\n        transition: 'transform .72s cubic-bezier(.72,0,.16,1)', overflowY: 'auto'\n      }\n    };\n  }\n}\n\n"]];
