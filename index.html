<script type="text/x-dc" data-dc-script>
const ROUTES = [
  ['home', 'Startseite', 'page-home'],
  ['projekte', 'Projekte', 'page-projects'],
  ['projekt', 'Projekt', 'page-detail-v1'],
  ['leistungen', 'Leistungen', 'page-services'],
  ['immobilien', 'Immobilien', 'page-realestate'],
  ['spezialgebiete', 'Spezialgebiete', 'page-specialties'],
  ['ueber-uns', 'Über uns', 'page-about'],
  ['news', 'News', 'page-news-v1'],
  ['jobs', 'Jobs', 'page-jobs'],
  ['kontakt', 'Kontakt', 'page-contact']
];
const FILE_TO_ROUTE = {
  '01 Home': 'home', '02 Projects': 'projekte', '03 Project Detail': 'projekt',
  '04 Services': 'leistungen', '05 Real Estate': 'immobilien', '06 Specialties': 'spezialgebiete',
  '07 About': 'ueber-uns', '08 News': 'news', '09 Jobs': 'jobs', '10 Contact': 'kontakt'
};

class Component extends DCLogic {
  state = { route: 'home', detailVer: 1, newsVer: 1, menuOpen: false, sub: null };

  componentDidMount() {
    this.syncHash();
    window.addEventListener('hashchange', this.syncHash);
    document.addEventListener('keydown', this.onKey);
    document.addEventListener('click', this.onDocClick, true);
  }
  componentWillUnmount() {
    window.removeEventListener('hashchange', this.syncHash);
    document.removeEventListener('keydown', this.onKey);
    document.removeEventListener('click', this.onDocClick, true);
    document.body.style.overflow = '';
  }
  componentDidUpdate(pp, ps) {
    if (ps.menuOpen !== this.state.menuOpen) document.body.style.overflow = this.state.menuOpen ? 'hidden' : '';
  }
  onKey = (e) => { if (e.key === 'Escape') this.setState({ menuOpen: false, sub: null }); };

  syncHash = () => {
    const id = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    if (id && ROUTES.some(r => r[0] === id) && id !== this.state.route) this.setState({ route: id, menuOpen: false, sub: null });
  };

  // In-content links still point at the standalone page files — keep them inside the prototype.
  onDocClick = (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    const href = decodeURIComponent(a.getAttribute('href') || '');
    const m = href.match(/([^/]+)\.dc\.html/);
    if (!m) return;
    const route = FILE_TO_ROUTE[m[1]];
    if (!route) return;
    e.preventDefault();
    e.stopPropagation();
    this.go(route);
  };

  go(route) {
    const next = { route, menuOpen: false, sub: null };
    if (route === 'projekt' && this.state.route !== 'projekt') next.detailVer = 1;
    this.setState(next);
    if (location.hash !== '#/' + route) location.hash = '#/' + route;
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  toggle(k) { this.setState(s => ({ sub: s.sub === k ? null : k })); }

  topBtn(active) {
    return {
      background: 'none', border: 0, padding: '6px 0', cursor: 'pointer',
      font: '500 12px/1 Manrope, sans-serif', letterSpacing: '.18em', textTransform: 'uppercase',
      color: active ? '#2E2E2E' : '#9A9A9A',
      borderBottom: active ? '1px solid #2E2E2E' : '1px solid transparent',
      transition: 'color .3s ease, border-color .3s ease'
    };
  }
  menuBtn(active, expandable) {
    const base = {
      display: 'flex', alignItems: 'baseline', gap: '16px', background: 'none', border: 0,
      padding: expandable ? '10px 0' : '6px 0', cursor: 'pointer', textAlign: 'left',
      font: '400 27px/1.2 Manrope, sans-serif', letterSpacing: '.26em', textTransform: 'uppercase',
      color: active ? '#9A9A9A' : '#2E2E2E', transition: 'color .3s ease'
    };
    return base;
  }
  subBtn(active) {
    return {
      background: 'none', border: 0, padding: 0, cursor: 'pointer', textAlign: 'left',
      font: '400 15px/1.4 Manrope, sans-serif', letterSpacing: '.10em',
      color: active ? '#2E2E2E' : '#6B6B6B', transition: 'color .3s ease'
    };
  }
  footBtn(active) {
    return {
      background: 'none', border: 0, padding: 0, cursor: 'pointer', textAlign: 'left',
      font: '400 16px/1.4 Manrope, sans-serif', color: active ? '#9A9A9A' : '#2E2E2E',
      transition: 'color .3s ease'
    };
  }
  segBtn(active) {
    return {
      background: active ? '#FFFFFF' : 'transparent', border: 0,
      borderRight: '1px solid rgba(0,0,0,.14)', padding: '9px 20px', cursor: 'pointer',
      font: '500 11px/1 Manrope, sans-serif', letterSpacing: '.18em', textTransform: 'uppercase',
      color: active ? '#2E2E2E' : '#9A9A9A', transition: 'background .25s ease, color .25s ease'
    };
  }

  renderVals() {
    const { route, detailVer, newsVer } = this.state;
    const open = this.state.menuOpen;
    const hasVersions = route === 'projekt';
    const ver = route === 'projekt' ? detailVer : newsVer;
    const seg2 = this.segBtn(ver === 2);
    seg2.borderRight = 0;

    return {
      isHome: route === 'home',
      isProjects: route === 'projekte',
      isDetailV1: route === 'projekt',
      isServices: route === 'leistungen',
      isRealEstate: route === 'immobilien',
      isSpecialties: route === 'spezialgebiete',
      isAbout: route === 'ueber-uns',
      isNewsV2: route === 'news',
      isJobs: route === 'jobs',
      isContact: route === 'kontakt',

      hasVersions,
      showVersionToggle: false,
      showBack: route === 'projekt',
      goBack: () => this.go('projekte'),
      v1Style: this.segBtn(ver === 1),
      v2Style: seg2,
      pickV1: () => this.setState(route === 'projekt' ? { detailVer: 1 } : { newsVer: 1 }),
      pickV2: () => this.setState(route === 'projekt' ? { detailVer: 2 } : { newsVer: 2 }),

      stageStyle: { paddingTop: hasVersions ? '56px' : 0 },
      stageClass: hasVersions ? 'wa-stage wa-shift' : 'wa-stage',

      topNav: [['projekte', 'Alle Projekte'], ['news', 'News'], ['kontakt', 'Kontakt']].map(([id, label]) => ({
        label, style: this.topBtn(route === id), go: () => this.go(id)
      })),
      footerNav: ROUTES.filter(r => r[0] !== 'projekt' && r[0] !== 'home').map(([id, label]) => ({
        label, style: this.footBtn(route === id), go: () => this.go(id)
      })),

      goHome: (e) => { if (e) e.preventDefault(); this.go('home'); },
      goProjects: () => this.go('projekte'),
      goServices: () => this.go('leistungen'),
      goRealEstate: () => this.go('immobilien'),
      goSpecialties: () => this.go('spezialgebiete'),
      goAbout: () => this.go('ueber-uns'),
      goNews: () => this.go('news'),
      goJobs: () => this.go('jobs'),
      goContact: () => this.go('kontakt'),

      mProjects: this.menuBtn(route === 'projekte' || route === 'projekt', false),
      mLeistungen: this.menuBtn(route === 'leistungen' || route === 'immobilien' || route === 'spezialgebiete', true),
      mAbout: this.menuBtn(route === 'ueber-uns', true),
      mNews: this.menuBtn(route === 'news', false),
      mJobs: this.menuBtn(route === 'jobs', true),
      mContact: this.menuBtn(route === 'kontakt', false),
      sServices: this.subBtn(route === 'leistungen'),
      sRealEstate: this.subBtn(route === 'immobilien'),
      sSpecialties: this.subBtn(route === 'spezialgebiete'),
      sAbout: this.subBtn(route === 'ueber-uns'),
      sJobs: this.subBtn(route === 'jobs'),

      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false, sub: null }),
      toggleLeistungen: () => this.toggle('leistungen'),
      toggleUeberUns: () => this.toggle('ueber'),
      toggleJobs: () => this.toggle('jobs'),
      subLeistungen: this.state.sub === 'leistungen',
      subUeberUns: this.state.sub === 'ueber',
      subJobs: this.state.sub === 'jobs',

      panelStyle: {
        position: 'fixed', top: 0, bottom: 0, right: 0, zIndex: 420,
        width: 'min(46vw, 620px)', display: 'flex', flexDirection: 'column',
        background: 'rgba(252,250,247,0.70)',
        backdropFilter: 'blur(26px) saturate(1.1)', WebkitBackdropFilter: 'blur(26px) saturate(1.1)',
        borderLeft: '1px solid rgba(0,0,0,0.10)',
        transform: open ? 'none' : 'translateX(102%)',
        transition: 'transform .72s cubic-bezier(.72,0,.16,1)', overflowY: 'auto'
      },
      scrimStyle: {
        position: 'fixed', top: 0, bottom: 0, left: 0, right: 'min(46vw, 620px)', zIndex: 410, background: 'rgba(17,17,17,0.45)',
        opacity: open ? 1 : 0, pointerEvents: open ? 'auto' : 'none', transition: 'opacity .6s ease'
      }
    };
  }
}

</script>
